<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Éditeur Outdoor PRO - Tracé Securisé</title>
    
    <!-- Leaflet (Cartographie) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Chart.js (Profil Altimétrique) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; background: #f5f6fa; overflow: hidden; }
        #main-container { display: flex; height: 100vh; width: 100vw; }
        
        #controls-sidebar {
            width: 340px; min-width: 340px; background: white; padding: 20px; 
            box-shadow: 2px 0 15px rgba(0,0,0,0.1); z-index: 1000; 
            box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;
            overflow-y: auto; height: 100%;
        }
        
        #map-container { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; }
        #map { flex: 1; width: 100%; }
        
        #elevation-container { 
            height: 190px; 
            background: white; 
            border-top: 2px solid #ddd; 
            padding: 10px 20px; 
            box-sizing: border-box;
            display: none;
        }
        
        h3 { margin: 0; font-size: 16px; color: #2c3e50; text-align: center; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        
        .mode-selector { display: flex; gap: 4px; background: #f1f2f6; padding: 4px; border-radius: 6px; }
        .mode-btn { flex: 1; background: transparent; color: #7f8c8d; padding: 8px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .mode-btn.active { background: #2c3e50; color: white; }
        
        .control-group { margin-bottom: 2px; }
        .group-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 4px; }
        
        input[type=range] { width: 100%; height: 6px; background: #ddd; border-radius: 3px; outline: none; cursor: pointer; }
        
        .radio-group { display: flex; justify-content: space-around; background: #f1f2f6; padding: 8px; border-radius: 5px; }
        .radio-group label { font-size: 12px; font-weight: bold; color: #2c3e50; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        
        #sub-drawing-mode { display: none; background: #fff3cd; border: 1px solid #ffeeba; padding: 6px; border-radius: 5px; flex-direction: column; gap: 4px; }
        .sub-mode-title { font-size: 11px; font-weight: bold; color: #856404; margin-bottom: 2px; text-align: center;}
        .drawing-type-selector { display: flex; gap: 4px; }
        .draw-btn { flex: 1; padding: 6px; font-size: 11px; border-radius: 4px; border: 1px solid #ccc; background: white; cursor: pointer; font-weight: bold; }
        .draw-btn.active { background: #e67e22; color: white; border-color: #d35400; }

        .btn-stack { display: flex; flex-direction: column; gap: 6px; margin-top: 5px; }
        button.action-btn { color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; font-size: 13px; transition: opacity 0.2s; }
        button:disabled { background: #bdc3c7 !important; cursor: not-allowed; opacity: 0.6; }
        
        #route-btn { background: #3498db; }
        #next-btn { background: #e67e22; }
        #gpx-btn { background: #2ecc71; }
        
        .sub-btn-grid { display: flex; gap: 5px; }
        #undo-btn { background: #95a5a6; flex: 1; }
        #reset-btn { background: #e74c3c; flex: 1; }
        
        .grise { opacity: 0.35; pointer-events: none; }
        #info { margin-top: auto; font-size: 12px; color: #2c3e50; text-align: center; font-weight: bold; border-top: 1px solid #eee; padding-top: 10px; line-height: 1.5; }

        @media (max-width: 768px) {
            #main-container { flex-direction: column; }
            #controls-sidebar { width: 100%; min-width: 100%; height: 40vh; max-height: 40vh; }
            #map-container { height: 60vh; }
            #elevation-container { height: 150px; padding: 5px 10px; }
        }
    </style>
</head>
<body>

    <div id="main-container">
        
        <div id="controls-sidebar">
            <h3>Éditeur Outdoor PRO</h3>
            
            <div class="mode-selector">
                <button id="btn-mode-auto" class="mode-btn active">⚡ Auto (Curseurs)</button>
                <button id="btn-mode-manual" class="mode-btn">✏️ Dessin (Points)</button>
            </div>

            <div id="sub-drawing-mode">
                <div class="sub-mode-title">Type de liaison pour le prochain point :</div>
                <div class="drawing-type-selector">
                    <button id="draw-auto-btn" class="draw-btn active">🤖 Auto (Chemins)</button>
                    <button id="draw-manual-btn" class="draw-btn">✏️ Manuel (Droit)</button>
                </div>
            </div>
            
            <div class="radio-group">
                <label><input type="radio" name="format" value="boucle" checked> 🔄 Boucle</label>
                <label><input type="radio" name="format" value="aller-retour"> ↕️ Aller-Retour</label>
            </div>
            
            <div class="control-group" style="background: #f8f9fa; padding: 8px; border-radius: 5px; border: 1px solid #eee;">
                <div class="group-label">
                    <span>⏱️ Allure cible :</span>
                    <span id="allure-val">6:00 /km</span>
                </div>
                <input type="range" id="allure-slider" min="3" max="15" value="6" step="0.25">
            </div>
            
            <div id="sliders-zone">
                <div class="control-group">
                    <div class="group-label">
                        <span>Distance cible :</span>
                        <span id="distance-val">8 km</span>
                    </div>
                    <input type="range" id="distance-slider" min="2" max="50" value="8" step="1">
                </div>
            </div>
            
            <div class="btn-stack">
                <button id="route-btn" class="action-btn" disabled>Générer le tracé</button>
                <button id="next-btn" class="action-btn" disabled>🔄 Varier le parcours auto</button>
                <button id="gpx-btn" class="action-btn" disabled>💾 Exporter en fichier GPX</button>
                
                <div class="sub-btn-grid">
                    <button id="undo-btn" class="action-btn">↩️ Annuler</button>
                    <button id="reset-btn" class="action-btn">❌ Reset</button>
                </div>
            </div>
            
            <div id="info">📍 Cliquez sur la carte pour poser votre point de départ.</div>
        </div>
        
        <div id="map-container">
            <div id="map"></div>
            <div id="elevation-container">
                <canvas id="elevationChart"></canvas>
            </div>
        </div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Fonction utilitaire pour calculer la distance à vol d'oiseau
        function calculerDistanceEntreDeuxPoints(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        const planCarto = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap contributors © CARTO'
        });
        
        const carteTopoEsri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles © Esri'
        });

        const map = L.map('map', {
            center: [46.4632, 4.6582], // Tu pourras changer pour centrer sur la Bourgogne
            zoom: 12,
            layers: [planCarto]
        });

        const fondsDeCarte = { "Plan standard (Carto)": planCarto, "Carte Topo & Relief (Esri)": carteTopoEsri };
        L.control.layers(fondsDeCarte, null, { collapsed: false }).addTo(map);

        let currentMode = 'auto';
        let drawingMethod = 'auto'; 
        let waypoints = []; 
        let markersGroup = L.layerGroup().addTo(map);
        let routeLayer = null; 
        let hoverMarker = null; 
        let currentAngleOffset = 0; 
        let globalCoordinates = []; 
        let coordinateMappingIndices = []; 
        let totalCalculatedDistance = 0;
        let totalCalculatedDPlus = 0;
        let totalCalculatedDMoins = 0;
        let elevationChart = null; 

        let datasetDPlusCumule = [];
        let datasetDMoinsCumule = [];

        const pointSuiviIcon = L.divIcon({
            className: 'custom-hover-point',
            html: '<div style="background-color: #3498db; width: 12px; height: 12px; border: 2px solid white; border-radius: 50%; box-shadow: 0 0 6px rgba(0,0,0,0.4);"></div>',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });

        const orangeIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        const btnAuto = document.getElementById('btn-mode-auto');
        const btnManual = document.getElementById('btn-mode-manual');
        const slidersZone = document.getElementById('sliders-zone');
        const nextBtn = document.getElementById('next-btn');
        const routeBtn = document.getElementById('route-btn');
        const gpxBtn = document.getElementById('gpx-btn');
        const elevationContainer = document.getElementById('elevation-container');
        const subDrawingModeContainer = document.getElementById('sub-drawing-mode');

        btnAuto.addEventListener('click', () => {
            if(currentMode !== 'auto') {
                currentMode = 'auto';
                btnAuto.classList.add('active');
                btnManual.classList.remove('active');
                slidersZone.classList.remove('grise');
                subDrawingModeContainer.style.display = 'none';
                nettoyerCarte();
                document.getElementById('info').innerText = "⚡ Mode Auto actif. Cliquez pour poser votre départ.";
            }
        });

        btnManual.addEventListener('click', () => {
            if(currentMode !== 'manual') {
                currentMode = 'manual';
                btnManual.classList.add('active');
                btnAuto.classList.remove('active');
                slidersZone.classList.add('grise');
                subDrawingModeContainer.style.display = 'flex';
                nettoyerCarte();
                document.getElementById('info').innerText = "✏️ Mode Dessin actif. Cliquez successivement sur la carte.";
            }
        });

        const drawAutoBtn = document.getElementById('draw-auto-btn');
        const drawManualBtn = document.getElementById('draw-manual-btn');

        drawAutoBtn.addEventListener('click', () => {
            drawingMethod = 'auto';
            drawAutoBtn.classList.add('active');
            drawManualBtn.classList.remove('active');
        });

        drawManualBtn.addEventListener('click', () => {
            drawingMethod = 'manual';
            drawManualBtn.classList.add('active');
            drawAutoBtn.classList.remove('active');
        });

        const allureSlider = document.getElementById('allure-slider');
        const allureVal = document.getElementById('allure-val');
        
        function formatAllure(valeurDecimale) {
            let minutes = Math.floor(valeurDecimale);
            let secondes = Math.round((valeurDecimale - minutes) * 60);
            if(secondes === 60) { minutes++; secondes = 0; }
            return `${minutes}:${secondes.toString().padStart(2, '0')} /km`;
        }

        allureSlider.addEventListener('input', (e) => { 
            allureVal.innerText = formatAllure(parseFloat(e.target.value)); 
            calculEstimationDuree(); 
        });

        const distanceSlider = document.getElementById('distance-slider');
        const distanceVal = document.getElementById('distance-val');
        distanceSlider.addEventListener('input', (e) => { distanceVal.innerText = `${e.target.value} km`; });

        map.on('click', (e) => {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            
            if (currentMode === 'auto') {
                if (waypoints.length === 0) {
                    waypoints.push({lat, lng, method: 'auto'});
                    reconstruireMarqueurs();
                    routeBtn.disabled = false;
                    nextBtn.disabled = false;
                    document.getElementById('info').innerText = "Départ fixé. Cliquez sur 'Générer le tracé' !";
                }
            } else {
                waypoints.push({lat, lng, method: waypoints.length === 0 ? 'auto' : drawingMethod});
                reconstruireMarqueurs();
                if (waypoints.length >= 1) {
                    routeBtn.disabled = false;
                    générerTracéMaitre();
                }
            }
        });

        function reconstruireMarqueurs() {
            markersGroup.clearLayers();
            waypoints.forEach((wp, index) => {
                const isStart = index === 0;
                const marker = L.marker([wp.lat, wp.lng], {
                    icon: isStart ? new L.Icon.Default() : orangeIcon,
                    draggable: true
                }).addTo(markersGroup);

                marker.bindPopup(isStart ? "<b>Départ (Glissable)</b>" : `<b>Étape ${index} (${wp.method})</b>`);

                marker.on('dragend', (event) => {
                    const position = event.target.getLatLng();
                    waypoints[index].lat = position.lat;
                    waypoints[index].lng = position.lng;
                    générerTracéMaitre();
                });

                marker.on('contextmenu', () => {
                    waypoints.splice(index, 1);
                    reconstruireMarqueurs();
                    if(waypoints.length > 0) générerTracéMaitre();
                    else document.getElementById('reset-btn').click();
                });
            });
        }

        document.getElementById('undo-btn').addEventListener('click', () => {
            if (waypoints.length > 0) {
                waypoints.pop();
                reconstruireMarqueurs();
                if (waypoints.length > 0) générerTracéMaitre();
                else document.getElementById('reset-btn').click();
            }
        });

        routeBtn.addEventListener('click', () => { currentAngleOffset = 0; générerTracéMaitre(); });
        nextBtn.addEventListener('click', () => { currentAngleOffset += 0.8; générerTracéMaitre(); });

        function générerTracéMaitre() {
            générerParcoursHybride(1.0);
        }

        async function générerParcoursHybride(facteurEchelle, iteration = 0) {
            if (waypoints.length === 0) return;
            
            const distanceChoisie = parseFloat(distanceSlider.value);
            const formatChoisi = document.querySelector('input[name="format"]:checked').value;
            
            let segmentsAVisiter = [];

            if (currentMode === 'manual' || waypoints.length > 1) {
                segmentsAVisiter = [...waypoints];
                if (formatChoisi === "boucle" && waypoints.length > 1) {
                    segmentsAVisiter.push({lat: waypoints[0].lat, lng: waypoints[0].lng, method: drawingMethod});
                }
            } else {
                const start = waypoints[0];
                segmentsAVisiter.push(start);
                if (formatChoisi === "aller-retour") {
                    const cap = (distanceChoisie / 2) * 0.0065 * 0.72 * facteurEchelle;
                    segmentsAVisiter.push({ lat: start.lat + cap * Math.cos(currentAngleOffset), lng: start.lng + cap * Math.sin(currentAngleOffset), method: 'auto' });
                } else {
                    const rayon = (distanceChoisie / 4) * 0.0072 * 0.68 * facteurEchelle;
                    segmentsAVisiter.push({ lat: start.lat + rayon * Math.cos(currentAngleOffset), lng: start.lng + rayon * Math.sin(currentAngleOffset), method: 'auto' });
                    let sPts = { lat: start.lat + rayon * Math.cos(currentAngleOffset + 0.8), lng: start.lng + rayon * Math.sin(currentAngleOffset + 0.8), method: 'auto' };
                    segmentsAVisiter.push(sPts);
                    segmentsAVisiter.push({ lat: start.lat + rayon * Math.cos(currentAngleOffset + 1.6), lng: start.lng + rayon * Math.sin(currentAngleOffset + 1.6), method: 'auto' });
                    segmentsAVisiter.push({lat: start.lat, lng: start.lng, method: 'auto'});
                }
            }

            document.getElementById('info').innerText = "Calcul du tracé...";
            
            let fullCoordinates = [];
            let distanceTotaleCumulee = 0;

            for (let i = 0; i < segmentsAVisiter.length; i++) {
                if (i === 0) {
                    fullCoordinates.push({lat: segmentsAVisiter[0].lat, lng: segmentsAVisiter[0].lng, alt: 280});
                    continue;
                }

                let ptPrecedent = segmentsAVisiter[i - 1];
                let ptActuel = segmentsAVisiter[i];

                if (ptActuel.method === 'manual') {
                    // MODIFICATION : Au lieu de tracer juste un point A et un point B
                    // On interpole virtuellement un point tous les 50 mètres le long de la ligne droite
                    // Cela donne de la matière pour que l'API Open-Meteo puisse lire les collines intermédiaires !
                    let distSegment = calculerDistanceEntreDeuxPoints(ptPrecedent.lat, ptPrecedent.lng, ptActuel.lat, ptActuel.lng);
                    let nbEtapes = Math.max(1, Math.floor((distSegment * 1000) / 50)); // 1 point tous les 50m
                    
                    for(let etp = 1; etp <= nbEtapes; etp++) {
                        let fraction = etp / nbEtapes;
                        let latInterp = ptPrecedent.lat + (ptActuel.lat - ptPrecedent.lat) * fraction;
                        let lngInterp = ptPrecedent.lng + (ptActuel.lng - ptPrecedent.lng) * fraction;
                        
                        let derniereAlt = fullCoordinates[fullCoordinates.length - 1]?.alt || 280;
                        fullCoordinates.push({lat: latInterp, lng: lngInterp, alt: derniereAlt});
                    }
                    distanceTotaleCumulee += distSegment;
                } else {
                    try {
                        let urlSegment = "https://brouter.de/brouter?lonlats=" + ptPrecedent.lng.toFixed(6) + "," + ptPrecedent.lat.toFixed(6) + "|" + ptActuel.lng.toFixed(6) + "," + ptActuel.lat.toFixed(6) + "&profile=trekking&alternativeidx=0&format=geojson";
                        let response = await fetch(urlSegment);
                        if (!response.ok) throw new Error();
                        let data = await response.json();
                        
                        if (data.features && data.features[0] && data.features[0].geometry) {
                            let pointsSegment = data.features[0].geometry.coordinates;
                            let coordProtegees = pointsSegment.map(pt => ({
                                lat: pt[1],
                                lng: pt[0],
                                alt: (pt[2] !== undefined && pt[2] !== null) ? pt[2] : (fullCoordinates[fullCoordinates.length - 1]?.alt || 280)
                            }));
                            fullCoordinates = fullCoordinates.concat(coordProtegees.slice(1));
                            distanceTotaleCumulee += data.features[0].properties['track-length'] / 1000;
                        }
                    } catch (e) {
                        let derniereAlt = fullCoordinates[fullCoordinates.length - 1]?.alt || 280;
                        fullCoordinates.push({lat: ptActuel.lat, lng: ptActuel.lng, alt: derniereAlt});
                        distanceTotaleCumulee += calculerDistanceEntreDeuxPoints(ptPrecedent.lat, ptPrecedent.lng, ptActuel.lat, ptActuel.lng);
                    }
                }
            }

            if (formatChoisi === "aller-retour" && currentMode === 'auto') {
                fullCoordinates = fullCoordinates.concat([...fullCoordinates].reverse());
                distanceTotaleCumulee = distanceTotaleCumulee * 2;
            }

            let ratio = distanceChoisie / distanceTotaleCumulee;

            if ((ratio < 0.92 || ratio > 1.08) && iteration < 4 && currentMode === 'auto') {
                générerParcoursHybride(facteurEchelle * ratio, iteration + 1);
            } else {
                traiterReliefDepuisTracé(fullCoordinates, distanceTotaleCumulee);
            }
        }

        function traiterReliefDepuisTracé(coordinates3D, distanceTotalKm) {
            if (coordinates3D.length === 0) return;
            document.getElementById('info').innerText = "Analyse altimétrique...";

            // CORRECTION CRITIQUE : Fixation stricte pour respecter la limite de 100 points de l'API Open-Meteo
            const maxPointsAPI = 80; // On laisse une marge de sécurité
            let pas = Math.ceil(coordinates3D.length / maxPointsAPI); 
            
            let lats = [];
            let lngs = [];
            let indexOrigine = [];
            
            for (let i = 0; i < coordinates3D.length; i += pas) {
                // toFixed(5) allège la longueur de l'URL tout en gardant une précision métrique
                lats.push(coordinates3D[i].lat.toFixed(5));
                lngs.push(coordinates3D[i].lng.toFixed(5));
                indexOrigine.push(i);
            }
            
            // S'assurer qu'on garde bien le tout dernier point pour boucler la courbe
            if (indexOrigine[indexOrigine.length - 1] !== coordinates3D.length - 1) {
                lats.push(coordinates3D[coordinates3D.length - 1].lat.toFixed(5));
                lngs.push(coordinates3D[coordinates3D.length - 1].lng.toFixed(5));
                indexOrigine.push(coordinates3D.length - 1);
            }

            const urlElevation = "https://api.open-meteo.com/v1/elevation?latitude=" + lats.join(',') + "&longitude=" + lngs.join(',');

            fetch(urlElevation)
            .then(res => {
                if (!res.ok) throw new Error("API Open-Meteo rejetée");
                return res.json();
            })
            .then(data => {
                let rawElevations = data.elevation || indexOrigine.map(idx => coordinates3D[idx].alt);
                
                let smoothedElevations = [];
                for (let i = 0; i < rawElevations.length; i++) {
                    let p2 = rawElevations[Math.max(0, i - 2)];
                    let p1 = rawElevations[Math.max(0, i - 1)];
                    let curr = rawElevations[i];
                    let n1 = rawElevations[Math.min(rawElevations.length - 1, i + 1)];
                    let n2 = rawElevations[Math.min(rawElevations.length - 1, i + 2)];
                    smoothedElevations.push((p2 + p1 + curr + n1 + n2) / 5);
                }

                let labelsDistance = [0];
                let donneesAltitude = [smoothedElevations[0]];
                let distanceAccumulee = 0;
                
                coordinateMappingIndices = [...indexOrigine];

                for (let i = 1; i < smoothedElevations.length; i++) {
                    let ptA = coordinates3D[indexOrigine[i - 1]];
                    let ptB = coordinates3D[indexOrigine[i]];
                    distanceAccumulee += calculerDistanceEntreDeuxPoints(ptA.lat, ptA.lng, ptB.lat, ptB.lng);
                    
                    labelsDistance.push(distanceAccumulee.toFixed(1));
                    donneesAltitude.push(smoothedElevations[i]);
                }

                let dPlusCumule = 0;
                let dMoinsCumule = 0;
                datasetDPlusCumule = [0];
                datasetDMoinsCumule = [0];

                let derniereAltitudeValide = donneesAltitude[0];
                const SEUIL_AUTONOME = 6.0; 

                for (let k = 1; k < donneesAltitude.length; k++) {
                    let altActuelle = donneesAltitude[k];
                    let delta = altActuelle - derniereAltitudeValide;

                    if (delta >= SEUIL_AUTONOME) {
                        dPlusCumule += delta;
                        derniereAltitudeValide = altActuelle; 
                    } else if (delta <= -SEUIL_AUTONOME) {
                        dMoinsCumule += Math.abs(delta);
                        derniereAltitudeValide = altActuelle; 
                    }

                    datasetDPlusCumule.push(Math.round(dPlusCumule));
                    datasetDMoinsCumule.push(Math.round(dMoinsCumule));
                }

                totalCalculatedDPlus = Math.round(dPlusCumule);
                totalCalculatedDMoins = Math.round(dMoinsCumule);

                afficherLigneSurCarte(coordinates3D, distanceTotalKm, totalCalculatedDPlus, totalCalculatedDMoins);
                dessinerProfilAltimetrique(labelsDistance, donneesAltitude);
            })
            .catch(() => {
                // S'il y a un plantage de l'API externe, on affiche quand même le trait rouge sur la carte 
                afficherLigneSurCarte(coordinates3D, distanceTotalKm, 0, 0);
                elevationContainer.style.display = "none";
            });
        }

        function dessinerProfilAltimetrique(labelsDistance, donneesAltitude) {
            elevationContainer.style.display = "block"; 
            map.invalidateSize(); 

            if (elevationChart) {
                elevationChart.destroy(); 
            }

            const ctx = document.getElementById('elevationChart').getContext('2d');
            let gradient = ctx.createLinearGradient(0, 0, 0, 140);
            gradient.addColorStop(0, 'rgba(52, 152, 219, 0.35)');
            gradient.addColorStop(1, 'rgba(52, 152, 219, 0.00)');

            elevationChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labelsDistance,
                    datasets: [{
                        label: 'Altitude',
                        data: donneesAltitude,
                        borderColor: '#3498db',
                        borderWidth: 2,
                        backgroundColor: gradient,
                        fill: true,
                        tension: 0.3, 
                        pointRadius: 0, 
                        pointHoverRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            callbacks: {
                                title: (tooltipItems) => `Distance : ${tooltipItems[0].label} km`,
                                label: (context) => {
                                    let idx = context.dataIndex;
                                    let alt = context.parsed.y;
                                    let dPlus = datasetDPlusCumule[idx] || 0;
                                    let dMoins = datasetDMoinsCumule[idx] || 0;
                                    return [
                                        ` Altitude : ${alt.toFixed(0)} m`,
                                        ` Cumul D+ : +${dPlus} m`,
                                        ` Cumul D- : -${dMoins} m`
                                    ];
                                }
                            }
                        }
                    },
                    interaction: { mode: 'index', intersect: false },
                    onHover: (event, activeElements) => {
                        if (activeElements && activeElements.length > 0 && globalCoordinates.length > 0) {
                            const chartIndex = activeElements[0].index;
                            const globalIndex = coordinateMappingIndices[chartIndex];
                            if (globalIndex !== undefined && globalCoordinates[globalIndex]) {
                                const targetCoord = globalCoordinates[globalIndex];
                                if (!hoverMarker) {
                                    hoverMarker = L.marker([targetCoord.lat, targetCoord.lng], { icon: pointSuiviIcon }).addTo(map);
                                } else {
                                    hoverMarker.setLatLng([targetCoord.lat, targetCoord.lng]);
                                }
                            }
                        }
                    },
                    scales: {
                        x: { grid: { display: false }, title: { display: true, text: 'Distance (km)', font: { size: 11, weight: 'bold' } } },
                        y: { title: { display: true, text: 'Altitude (m)', font: { size: 11, weight: 'bold' } } }
                    }
                }
            });

            document.getElementById('elevationChart').addEventListener('mouseleave', () => {
                if (hoverMarker) { map.removeLayer(hoverMarker); hoverMarker = null; }
            });
        }

        function afficherLigneSurCarte(coordinates, distanceTotalKm, dPlus, dMoins) {
            globalCoordinates = coordinates;
            totalCalculatedDistance = distanceTotalKm;
            totalCalculatedDPlus = dPlus;
            totalCalculatedDMoins = dMoins;

            if (routeLayer) map.removeLayer(routeLayer);

            const leafletCoords = coordinates.map(pt => [pt.lat, pt.lng]);
            routeLayer = L.polyline(leafletCoords, { color: '#2c3e50', weight: 5, opacity: 0.9 }).addTo(map);
            
            let bounds = routeLayer.getBounds();
            map.fitBounds(bounds, { maxZoom: map.getZoom() });

            gpxBtn.disabled = false;
            calculEstimationDuree();
        }

        map.on('mousemove', (e) => {
            if (!elevationChart || globalCoordinates.length === 0) return;

            const mouseLatLng = e.latlng;
            let plusProcheGlobalIndex = 0;
            let distanceMin = Infinity;

            for (let i = 0; i < globalCoordinates.length; i++) {
                let ptLatLng = L.latLng(globalCoordinates[i].lat, globalCoordinates[i].lng);
                let d = mouseLatLng.distanceTo(ptLatLng); 
                if (d < distanceMin) {
                    distanceMin = d;
                    plusProcheGlobalIndex = i;
                }
            }

            if (distanceMin < 40) {
                let plusProcheChartIndex = 0;
                let diffMin = Infinity;
                
                for (let j = 0; j < coordinateMappingIndices.length; j++) {
                    let diff = Math.abs(coordinateMappingIndices[j] - plusProcheGlobalIndex);
                    if (diff < diffMin) {
                        diffMin = diff;
                        plusProcheChartIndex = j;
                    }
                }

                const meta = elevationChart.getDatasetMeta(0);
                const point = meta.data[plusProcheChartIndex];
                
                if (point) {
                    elevationChart.setActiveElements([{ datasetIndex: 0, index: plusProcheChartIndex }]);
                    elevationChart.tooltip.setActiveElements([{ datasetIndex: 0, index: plusProcheChartIndex }], { x: point.x, y: point.y });
                    elevationChart.update();
                }

                const targetCoord = globalCoordinates[plusProcheGlobalIndex];
                if (!hoverMarker) {
                    hoverMarker = L.marker([targetCoord.lat, targetCoord.lng], { icon: pointSuiviIcon }).addTo(map);
                } else {
                    hoverMarker.setLatLng([targetCoord.lat, targetCoord.lng]);
                }
            } else {
                if (hoverMarker) { map.removeLayer(hoverMarker); hoverMarker = null; }
                elevationChart.setActiveElements([]);
                elevationChart.tooltip.setActiveElements([], { x: 0, y: 0 });
                elevationChart.update();
            }
        });

        function nettoyerCarte() {
            waypoints = []; 
            markersGroup.clearLayers();
            if (routeLayer) map.removeLayer(routeLayer);
            if (hoverMarker) { map.removeLayer(hoverMarker); hoverMarker = null; }
            totalCalculatedDistance = 0;
            totalCalculatedDPlus = 0;
            totalCalculatedDMoins = 0;
            globalCoordinates = [];
            coordinateMappingIndices = [];
            datasetDPlusCumule = [];
            datasetDMoinsCumule = [];
            routeBtn.disabled = true;
            nextBtn.disabled = true;
            gpxBtn.disabled = true;
            if (elevationChart) { elevationChart.destroy(); elevationChart = null; }
            elevationContainer.style.display = "none";
            map.invalidateSize();
        }

        function calculEstimationDuree() {
            if (totalCalculatedDistance === 0) return;
            const allureMinutesDecimale = parseFloat(allureSlider.value);
            let tempsTotalEffort = allureMinutesDecimale * totalCalculatedDistance;

            let h = Math.floor(tempsTotalEffort / 60);
            let m = Math.round(tempsTotalEffort % 60);
            if(m === 60) { h++; m = 0; }

            let chaineDuree = h > 0 ? `${h}h${m.toString().padStart(2, '0')}` : `${m} min`;

            document.getElementById('info').innerHTML = `🏁 Tracé hybride lissé !<br>` +
                `📏 Distance : <b>${totalCalculatedDistance.toFixed(1)} km</b> | ⛰️ Relief : <b>+${totalCalculatedDPlus} m / -${totalCalculatedDMoins} m</b><br>` +
                `⏱️ Durée est. (${formatAllure(allureMinutesDecimale)}) : <span style="color:#3498db;font-size:14px;"><b>${chaineDuree}</b></span>`;
        }

        gpxBtn.addEventListener('click', () => {
            if (globalCoordinates.length === 0) return;

            let gpxContent = `<?xml version="1.0" encoding="UTF-8"?>\n` +
                             `<gpx version="1.1" creator="Générateur Outdoor" xmlns="http://www.topografix.com/GPX/1/1">\n` +
                             `  <trk>\n    <name>Mon Tracé Outdoor</name>\n    <trkseg>\n`;

            for (let i = 0; i < globalCoordinates.length; i++) {
                gpxContent += `      <trkpt lat="${globalCoordinates[i].lat.toFixed(6)}" lon="${globalCoordinates[i].lng.toFixed(6)}"></trkpt>\n`;
            }

            gpxContent += `    </trkseg>\n  </trk>\n</gpx>`;

            const blob = new Blob([gpxContent], { type: 'application/gpx+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'parcours.gpx';
            document.body.appendChild(a); a.click();
            document.body.removeChild(a); URL.revokeObjectURL(url);
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            nettoyerCarte();
            document.getElementById('info').innerText = "📍 Cliquez sur la carte pour poser votre point de départ.";
        });
    </script>
</body>
</html>
